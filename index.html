<style>
@font-face{font-family:"DotGothic16";src:url("fonts/dotgothic16.woff2") format("woff2");font-display:swap}
:root{padding:0}
html,body{margin:0}
/* layout: one-screen phone app — header, list chips, quest header, scrolling items, add bar pinned at bottom */
:root{
  --bg:#251B23;--bg2:#180F17;--fg:#F2E4EA;--mut:#9B8795;--ln:#41303D;
  --acc:#E5583F;--gold:#E8B547;--ok:#7FD08A;--okt:#7FD08A;--plus:#E8B547;--shade:rgba(0,0,0,.5);
  --px:'DotGothic16',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3EADB;--bg2:#E2D3BC;--fg:#251B23;--mut:#6E5A66;--ln:#CDBBA3;
  --acc:#D9482F;--gold:#99660F;--ok:#D65C8A;--okt:#B23A68;--plus:#D65C8A;--shade:rgba(37,27,35,.35);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3EADB;--bg2:#E2D3BC;--fg:#251B23;--mut:#6E5A66;--ln:#CDBBA3;
  --acc:#D9482F;--gold:#99660F;--ok:#D65C8A;--okt:#B23A68;--plus:#D65C8A;--shade:rgba(37,27,35,.35);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--px);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;text-align:left}
input,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px dashed var(--acc);outline-offset:3px}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.hd{display:flex;align-items:center;gap:2px;padding-block:12px 0}
.logo{flex:1;font-size:22px;letter-spacing:1px;min-height:44px}.syd{display:inline-block;width:6px;height:6px;margin-left:8px;vertical-align:middle;background:var(--ln)}.syd.ok{background:var(--ok)}.syd.busy{background:var(--gold);animation:bl .8s steps(1) infinite}.syd.err{background:var(--acc)}@keyframes bl{50%{opacity:0}}
.ti[type=email],.ti[type=password]{margin-top:10px}.er{min-height:18px;margin-top:10px;font-size:11px;letter-spacing:1px;color:var(--acc)}.logo b{font-weight:400;color:var(--acc)}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.ib:active{transform:scale(.88)}
.ib svg{display:block}
.chips{display:flex;gap:18px;padding-block:12px 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar,.items::-webkit-scrollbar,.sh::-webkit-scrollbar{display:none}
.ch{font-size:12px;letter-spacing:1px;color:var(--mut);white-space:nowrap;min-height:28px;display:inline-flex;align-items:center;gap:6px}
.ch.on{color:var(--fg)}.ch.on::before{content:'▸';color:var(--acc)}
.ch .n{font-size:10px;color:var(--mut)}
.qh{border-top:2px solid var(--bg2);padding-block:18px 4px;display:flex;flex-direction:column;gap:8px;flex:none}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold)}
.qt{display:flex;align-items:flex-start;gap:8px}
.qt h1{flex:1;margin:0;font-weight:400;font-size:26px;letter-spacing:1px;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.meta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;color:var(--mut)}
.meta .left{color:var(--okt)}
.bar{display:grid;gap:2px;height:10px}
.bar i{display:block;background:var(--ln)}.bar i.f{background:var(--ok)}
.items{flex:1;overflow-y:auto;min-height:0;padding-block:4px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row{position:relative;border-bottom:1px dashed var(--ln);touch-action:pan-y}
.row .in{display:flex;align-items:center;gap:12px;padding:10px 0;background:var(--bg);position:relative;z-index:1;will-change:transform}
.row .del{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;background:var(--acc);color:var(--bg);font-size:12px;letter-spacing:2px}
.ck{width:44px;height:44px;margin:-10px 0 -10px -12px;display:flex;align-items:center;justify-content:center;flex:none}
.ck svg{width:20px;height:20px}
.ck .box{fill:var(--fg)}.ck .fillb{fill:var(--ok)}.ck .tick{fill:var(--bg)}
.tx{flex:1;min-width:0;font-size:15px;letter-spacing:1px;line-height:1.4;overflow-wrap:anywhere;padding:4px 0}
.row.done .tx{color:var(--mut);text-decoration:line-through}
.sub{display:block;font-size:10px;letter-spacing:1px;color:var(--mut);margin-top:2px;text-decoration:none}
.tg{font-size:10px;letter-spacing:1px;color:var(--gold);white-space:nowrap}.tg.bang{font-size:18px;line-height:1;color:var(--acc);text-shadow:1px 0 0 var(--acc)}
.q{font-size:11px;letter-spacing:1px;color:var(--mut);white-space:nowrap}
.hdl{width:36px;height:44px;margin:-10px -8px -10px 0;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ln);touch-action:none;cursor:grab}
.row.drag{z-index:5}.row.drag .in{background:var(--bg2);box-shadow:3px 3px 0 var(--acc)}
.empty{padding:48px 0;text-align:center;color:var(--mut);font-size:12px;letter-spacing:1px;line-height:2}
.empty b{display:block;color:var(--fg);font-weight:400;font-size:15px}
.clr{margin-top:14px;font-size:11px;letter-spacing:2px;color:var(--mut);min-height:44px;display:inline-flex;align-items:center}
.addb{flex:none;border-top:2px solid var(--bg2);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center}
.addf{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border-bottom:1px dashed var(--mut);padding:6px 0}
.addf span{color:var(--acc);font-size:16px}
.addf input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:16px;letter-spacing:1px;padding:4px 0;caret-color:var(--acc);user-select:text;-webkit-user-select:text}
.addf input::placeholder{color:var(--mut);opacity:1}
.go{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.go:active{transform:scale(.88)}
/* sheets */
.bd{position:absolute;inset:0;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.bd.o{opacity:1;pointer-events:auto}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;z-index:21;background:var(--bg);border-top:2px solid var(--fg);padding-block:12px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,1.1,.3,1);scrollbar-width:none}
.sh.o{transform:none}
.grip{width:44px;height:4px;background:var(--fg);margin:0 auto 16px}
.sht{font-size:11px;letter-spacing:2px;color:var(--mut);margin-bottom:6px}
.big{font-size:22px;letter-spacing:1px}
.fld{display:block;margin-top:18px}
.fld>span{display:block;font-size:11px;letter-spacing:2px;color:var(--mut);margin-bottom:4px}
.ti{display:block;width:100%;background:transparent;border:0;border-bottom:1px dashed var(--ln);border-radius:0;outline:none;font-size:17px;letter-spacing:1px;padding:6px 0 8px;user-select:text;-webkit-user-select:text}
.ti:focus{border-bottom-color:var(--acc)}
textarea.ti{resize:none;font-size:14px;line-height:1.6}
.step{display:flex;align-items:center;gap:0}
.step button{width:44px;height:44px;border:2px solid var(--ln);font-size:18px;display:flex;align-items:center;justify-content:center}
.step b{min-width:56px;text-align:center;font-weight:400;font-size:18px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{min-height:36px;padding:0 12px;border:1.5px solid var(--ln);font-size:12px;letter-spacing:1px;display:inline-flex;align-items:center}
.tag.on{border-color:var(--gold);color:var(--gold)}
.tagin{width:110px;border:1.5px dashed var(--ln);background:transparent;min-height:36px;padding:0 10px;font-size:12px;letter-spacing:1px;outline:none}
.acts{display:flex;gap:14px;margin-top:24px;align-items:stretch}
.pri{flex:1;height:50px;background:var(--fg);color:var(--bg);box-shadow:4px 4px 0 var(--acc);font-size:14px;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
.pri:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--acc)}
.sec{height:50px;padding:0 16px;border:2px solid var(--fg);font-size:12px;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
.sec.warn{border-color:var(--acc);color:var(--acc)}
.mi{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;border-bottom:1px dashed var(--ln);font-size:14px;letter-spacing:1px}
.mi small{font-size:10px;letter-spacing:1px;color:var(--mut);text-align:right}
.mi.warn{color:var(--acc)}
.mi[disabled]{opacity:.5;cursor:default}
.seg{display:flex;gap:8px}.seg button{flex:1;height:44px;border:2px solid var(--ln);font-size:12px;letter-spacing:1px;text-align:center}
.seg button.on{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.tpls{display:flex;flex-wrap:wrap;gap:8px}
/* toast + stamp */
.ts{position:absolute;left:max(18px,env(safe-area-inset-left,0px));right:max(18px,env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--bg);border:2px solid var(--fg);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg);padding:12px 14px;font-size:12px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;gap:10px;opacity:0;transform:translateY(12px);transition:all .25s steps(3);pointer-events:none}
.ts.o{opacity:1;transform:none;pointer-events:auto}
.ts button{color:var(--acc);letter-spacing:2px;min-height:32px}
.stampo{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .2s}
.stampo.o{opacity:1;pointer-events:auto}
.ring{width:170px;height:170px;border-radius:50%;border:5px solid var(--ok);color:var(--ok);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transform:scale(2.2) rotate(-14deg);opacity:0}
.stampo.o .ring{animation:slam .45s steps(5) forwards}
@keyframes slam{to{transform:scale(1) rotate(-8deg);opacity:1}}
.ring .k{line-height:0}.spr{display:block;flex:none;image-rendering:pixelated}.ch .spr{margin-right:-2px}.qt .spr{margin-top:-2px}
.icg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.ic{height:50px;border:1.5px solid var(--ln);display:flex;align-items:center;justify-content:center}.ic.on{border-color:var(--gold);background:var(--bg2)}
.bs .r .spr{transform:rotate(6deg)}.ring small{font-size:11px;letter-spacing:2px}
.stampo p{margin:0;font-size:13px;letter-spacing:2px;color:var(--fg);background:var(--bg);padding:6px 10px}
.book{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 8px;margin-top:16px}
.bs{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bs .r{width:84px;height:84px;border-radius:50%;border:3px solid var(--ok);color:var(--ok);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;transform:rotate(-6deg)}
.bs .r small{font-size:9px;letter-spacing:1px;margin-top:4px}
.bs span{font-size:10px;letter-spacing:1px;line-height:1.4;overflow-wrap:anywhere}
.note{font-size:11px;letter-spacing:1px;line-height:1.8;color:var(--mut);margin-top:14px}
@media (prefers-reduced-motion:reduce){.sh,.bd,.ts{transition:none}.stampo.o .ring{animation:none;transform:rotate(-8deg);opacity:1}}
</style>
</head>

</div>

/* ---------- state (example data on first open) ---------- */
const KEY='listexe.v1';
const it=(t,done,q,tags,note)=>({id:uid(),t,done:!!done,q:q||1,tags:tags||[],note:note||''});
const now=Date.now();
function seed(){
  const a={id:uid(),name:'tokyo packing',k:'packing',at:now-3*864e5,items:[it('passports',1),it('jr pass printout',1),it('charger + adapter',1),it('coin purse',0,1,['yen']),it('tote for thrifting'),it('film camera',1),it('umbrella',0,1,['rain']),it('comfy shoes',1),it('empty suitcase space',0,1,['!'],'leave room for records + ceramics')]};
  const b={id:uid(),name:'groceries',k:'groceries',at:now-864e5,items:[it('oat milk',0,2),it('eggs'),it('sourdough',1),it('tomatoes',0,6),it('coffee beans',1),it('lemons'),it('cat food',0,1,['!'])]};
  const c={id:uid(),name:'films to watch',k:'films',at:now-6*864e5,items:[it('perfect days',1),it('tampopo',1),it('drive my car'),it('tokyo story'),it('after life'),it('kikujiro')]};
  [a,b,c].forEach(x=>x.ex=true);
  return {lists:[a,b,c],cur:a.id,tpls:[{id:uid(),name:'trip packing',k:'packing',items:['passports','chargers','adapter','toiletries','meds','headphones','comfy shoes']}],book:[{id:uid(),name:'barcelona weekend',k:'trips',at:now-20*864e5,n:11}],snd:true,theme:'auto',example:true};
}
let st;
try{st=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){st=null}
if(!st||!Array.isArray(st.lists))st=seed();
st.book=st.book||[];st.tpls=st.tpls||[];st.book.forEach(b=>b.id=b.id||uid());st.tpls.forEach(x=>{x.id=x.id||uid();x.k=ik(x.k)});st.lists.forEach(l=>l.k=ik(l.k));st.book.forEach(b=>b.k=ik(b.k));
let saveT;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}},120);syncSoon()};
const cur=()=>st.lists.find(l=>l.id===st.cur)||st.lists[0];

/* ---------- theme ---------- */

applyTheme();

/* ---------- sound: soft rhodes blips, like tokyo.exe ---------- */
let AC;
function tone(f,t0=0,v=.08,du=.5){if(!st.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const a=AC,t=a.currentTime+t0,g=a.createGain(),o=a.createOscillator();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+du);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+du+.05)}catch(e){}}
const sfx={tick:()=>{tone(784);tone(1175,.06,.05)},untick:()=>tone(523,0,.06,.3),add:()=>tone(659,0,.06,.3),del:()=>{tone(392,0,.06,.25);tone(294,.07,.05,.3)},win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.09,.6));tone(1319,.5,.07,.9)},open:()=>tone(880,0,.04,.2)};

/* ---------- render ---------- */
function render(){renderChips();renderHead();renderItems()}
function renderChips(){
  $('chips').innerHTML=st.lists.map(l=>{const left=l.items.filter(i=>!i.done).length;return `<button class="ch${l.id===st.cur?' on':''}" data-l="${l.id}">${img(l.k,18)}${esc(l.name)}<span class="n">${left||'✓'}</span></button>`}).join('');
}
function renderHead(){
  const l=cur();
  if(!l){$('qh').innerHTML=`<div class="eyebrow">no lists yet</div><div class="qt"><h1>tap + to start a list</h1></div>`;return}
  const tot=l.items.length,dn=l.items.filter(i=>i.done).length,left=tot-dn;
  const segs=Math.max(1,Math.min(tot,24)),fill=tot?Math.round(dn/tot*segs):0;
  let bar='';for(let i=0;i<segs;i++)bar+=`<i class="${i<fill?'f':''}"></i>`;
  $('qh').innerHTML=`<div class="eyebrow">quest · ${l.shared?'shared':'just me'} · since ${dshort(l.at)}${l.ex?' · example':''}</div>
  <div class="qt">${img(l.k,34)}<h1>${esc(l.name)}</h1><button class="ib" id="bmenu" aria-label="List options" style="margin:-6px -12px 0 0"><svg width="20" height="20" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path fill="var(--fg)" d="M1 4h2v2H1z M4 4h2v2H4z M7 4h2v2H7z"/></svg></button></div>
  <div class="meta"><span>${dn} of ${tot} done</span><span class="left">${tot?(left?left+' left':'all done ✓'):''}</span></div>
  <div class="bar" style="grid-template-columns:repeat(${segs},minmax(0,1fr))">${bar}</div>`;
}

async function syncNow(){if(!me||!sb)return;if(syBusy){syAgain=true;return}syBusy=true;setSy('busy');
  try{if(sy.cur)await push();const ch=await pull();if(ch){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}if(!$('sh').classList.contains('o'))render();else renderChips()}await push();setSy('ok')}
  catch(e){const m=(e&&e.message)||'';const missing=e&&(e.code==='42P01'||e.code==='PGRST205'||/does not exist|schema cache/i.test(m));const denied=e&&(e.code==='42501'||e.status===401||e.status===403||/row-level security/i.test(m));
    setSy('err',missing?'sync table missing · run the setup script':denied?'this email isn’t on the members list':'offline · will retry')}
  finally{syBusy=false;if(syAgain){syAgain=false;syncSoon(300)}}}
const syLabel=()=>syState==='ok'?'✦ synced':syState==='busy'?'syncing…':syMsg||'';
function setSy(s,m=''){syState=s;syMsg=m;const d=$('syd');d.hidden=!me;d.className='syd '+(s==='ok'?'ok':s==='busy'?'busy':s==='off'?'':'err');const el=$('syst');if(el)el.textContent=syLabel()}
function startLive(){if(live||!sb)return;live=sb.channel(TBL).on('postgres_changes',{event:'*',schema:'public',table:TBL},()=>syncSoon(300)).subscribe()}
function sbInit(){if(sb)return sb;if(!window.supabase)return null;
  try{sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'listexe.auth'}});
  sb.auth.onAuthStateChange((ev,ss)=>{const u=ss&&ss.user||null,was=me;me=u;
    if(u&&!was)setTimeout(()=>{startLive();syncNow()},0);
    if(!u&&was){if(live){sb.removeChannel(live);live=null}setSy('off')}else setSy(syState)})}catch(e){sb=null}return sb}
function syncSheet(){sfx.open();if(!sbInit()){openSheet(`<div class="sht">sync</div><p class="note">sync couldn’t load · check your connection</p>`);return}
  if(me){openSheet(`<div class="sht">sync</div><div class="big">shared lists are live</div>
    <div style="margin-top:12px"><div class="mi">signed in <small>${esc(me.email)}</small></div><div class="mi">status <small id="syst">${syLabel()}</small></div></div>
    <div class="acts"><button class="pri" id="synow">sync now</button><button class="sec warn" id="syout">sign out</button></div>`);
    let armed=false;
    $('sh').onclick=async e=>{if(e.target.id==='synow'){syncNow()}else if(e.target.id==='syout'){if(!armed){armed=true;e.target.textContent='tap again';return}await sb.auth.signOut();sy={last:{},cur:null};sySave();closeSheet();toast('signed out · your lists stay on this phone')}};return}
  let mode='in';openSheet(`<div class="sht">sync</div><div class="big">sign in</div><p class="note" style="margin-top:6px">same account as quest.exe and tokyo.exe</p>
    <input class="ti" id="sye" type="email" inputmode="email" autocomplete="email" placeholder="your email" autocapitalize="off">
    <input class="ti" id="syp" type="password" autocomplete="current-password" placeholder="password">
    <div class="er" id="syer"></div>
    <div class="acts"><button class="pri" id="sygo">sign in</button></div>
    <div style="display:flex;justify-content:space-between;gap:12px;margin-top:16px"><button class="clr" id="symode" style="margin:0">first time? create account</button><button class="clr" id="syfg" style="margin:0">forgot password?</button></div>`);
  const er=t=>$('syer').textContent=t;
  $('sh').onclick=async e=>{
    if(e.target.id==='symode'){mode=mode==='in'?'up':'in';er('');$('sygo').textContent=mode==='in'?'sign in':'create account';e.target.textContent=mode==='in'?'first time? create account':'have an account? sign in'}
    else if(e.target.id==='syfg'){const email=$('sye').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email)){er('type your email above first');return}
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});er(error?error.message.toLowerCase():'check your email for a reset link')}
    else if(e.target.id==='sygo'){const b=e.target,email=$('sye').value.trim().toLowerCase(),password=$('syp').value;er('');
      if(!/^\S+@\S+\.\S+$/.test(email)){er('that email doesn’t look right');return}if(password.length<(mode==='up'?8:1)){er(mode==='up'?'use at least 8 characters':'enter your password');return}
      b.disabled=true;const lbl=b.textContent;b.textContent='one sec…';
      const r=mode==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});b.disabled=false;b.textContent=lbl;
      if(r.error){const m=r.error.message||'';er(/not confirmed/i.test(m)?'this account isn’t confirmed yet':/invalid login/i.test(m)?'no account with that email + password':/rate|seconds/i.test(m)?'too many tries · wait a minute':m.toLowerCase());return}
      if(!r.data.session){er('account made · confirm it, then sign in');return}
      sfx.win();closeSheet();toast('✦ signed in · syncing')}};
  ['sye','syp'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('sygo').click()}));
  setTimeout(()=>$('sye')?.focus(),350)}
$('logo').addEventListener('click',syncSheet);
sbInit();
setInterval(()=>{if(!document.hidden)syncSoon(0)},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSoon(0)});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
})();
</script>
